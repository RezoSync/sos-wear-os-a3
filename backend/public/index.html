<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SOS Wear | Centro de monitoreo</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    >
    <link rel="stylesheet" href="/dashboard/styles.css">
  </head>
  <body>
    <header>
      <div>
        <p class="eyebrow">SOS WEAR · CENTRO DE MONITOREO</p>
        <h1>Vista general de emergencias</h1>
      </div>
      <p id="connection" class="connection" role="status" aria-live="polite">Conectando…</p>
    </header>
    <main>
      <section class="sidebar" aria-label="Emergencias">
        <div class="sidebar-heading">
          <h2>Emergencias</h2>
          <span class="live-label">ACTIVAS</span>
        </div>
        <p id="empty-state">
          <span class="empty-symbol">✓</span>
          <strong>Sin alertas activas</strong>
          Esperando una señal SOS…
        </p>
        <ul id="emergencies"></ul>
        <p class="footnote">Actualización en tiempo real con reconexión automática</p>
      </section>
      <div id="map" aria-label="Mapa de ubicación SOS"></div>
    </main>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="/dashboard/app.js"></script>
  </body>
</html>
